data:
  dataset_name: newfacade/LeetCodeDataset
  max_samples: 200
  teacher_cache_dir: cache/teacher_logprobs_reasoning
  train_ratio: 0.9
evaluation:
  max_new_tokens: 16384
  output_dir: outputs/eval
student:
  max_length: 2048
  model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
teacher:
  local_model_path: cache/teacher-model-r1
  max_tokens: 16384
  temperature: 0.6
  top_p: 0.95
  top_logprobs: 20
training:
  alpha: 0.3
  batch_size: 1
  curriculum: length
  distill_temperature: 2.0
  eval_steps: 5
  gradient_accumulation_steps: 4
  learning_rate: 2e-5
  max_grad_norm: 1.0
  num_epochs: 1
  output_dir: outputs
  save_steps: 10
  skew_lambda: 0.1
  skew_lambda_max: 0.5
  adaptive_skew: false
  teacher_confidence_weight: true
  test_eval_steps: 10
  test_eval_problems: 5
  test_eval_max_new_tokens: 1024
  warmup_steps: 5
