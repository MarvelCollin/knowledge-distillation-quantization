data:
  dataset_name: newfacade/LeetCodeDataset
  max_samples: 1000
  teacher_cache_dir: cache/teacher_logprobs_r1_7b
  train_ratio: 0.9
evaluation:
  max_new_tokens: 24576
  output_dir: outputs/eval
student:
  max_length: 4096
  model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
teacher:
  local_model_path: cache/teacher-model-r1-7b
  max_tokens: 4096
  temperature: 0.6
  top_p: 0.95
  top_logprobs: 20
  gpu_memory_utilization: 0.92
  max_model_len: 6144
  cache_chunk_size: 16
training:
  alpha: 0.7
  batch_size: 1
  curriculum: length
  distill_temperature: 2.0
  eval_steps: 25
  gradient_accumulation_steps: 4
  learning_rate: 3e-6
  max_grad_norm: 1.0
  num_epochs: 1
  output_dir: outputs
  seed: 42
  skew_lambda: 0.2
  skew_lambda_max: 0.5
  adaptive_skew: true
  teacher_confidence_weight: true
  select_problems: 10
  select_max_new_tokens: 2048
  warmup_steps: 30
