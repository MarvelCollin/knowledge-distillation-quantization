data:
  dataset_name: newfacade/LeetCodeDataset
  max_samples: 2600
  teacher_cache_dir: cache/teacher_logprobs_coder15b
  train_ratio: 0.9
evaluation:
  max_new_tokens: 15360
  output_dir: outputs/eval
student:
  max_length: 16384
  model_name: Qwen/Qwen2.5-Coder-1.5B-Instruct
teacher:
  local_model_path: cache/teacher-model-r1-7b
  max_tokens: 16384
  temperature: 0.6
  top_p: 0.95
  top_logprobs: 20
  gpu_memory_utilization: 0.92
  max_model_len: 18432
  kv_cache_dtype: auto
  enable_chunked_prefill: true
  max_num_batched_tokens: 4096
  max_num_seqs: 16
  cache_chunk_size: 16
  rejection_samples: 1
  rejection_wave: 1
  rejection_temperature: 1.0
  rejection_top_p: 0.95
training:
  alpha: 0.7
  batch_size: 1
  curriculum: length
  distill_temperature: 3.0
  eval_steps: 25
  gradient_accumulation_steps: 4
  learning_rate: 5e-6
  max_grad_norm: 1.0
  num_epochs: 3
  output_dir: outputs
  seed: 42
  skew_lambda: 0.2
  skew_lambda_max: 0.5
  adaptive_skew: true
  teacher_confidence_weight: false
  select_problems: 20
  select_max_new_tokens: 15360
  warmup_steps: 30
  weight_decay: 0.01
  neftune_alpha: 5.0
