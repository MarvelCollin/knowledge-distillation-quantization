data:
  dataset_name: google-research-datasets/mbpp
  max_samples: 50
  teacher_cache_dir: cache/teacher_logprobs
  train_ratio: 0.9
evaluation:
  max_new_tokens: 256
  output_dir: outputs/eval
student:
  max_length: 512
  model_name: Qwen/Qwen2.5-Coder-3B-Instruct
teacher:
  api_base: https://openrouter.ai/api/v1
  max_tokens: 512
  model: deepseek/deepseek-v4-flash:free
  temperature: 0.0
  top_logprobs: 5
training:
  alpha: 0.7
  batch_size: 2
  distill_temperature: 2.0
  eval_steps: 5
  gradient_accumulation_steps: 2
  learning_rate: 2e-5
  max_grad_norm: 1.0
  num_epochs: 1
  output_dir: outputs
  save_steps: 10
  skew_lambda: 0.1
  warmup_steps: 5
