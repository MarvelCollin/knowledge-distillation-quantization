data:
  dataset_name: newfacade/LeetCodeDataset
  max_samples: 1000
  teacher_cache_dir: cache/teacher_logprobs_r1_7b
  train_ratio: 0.9
evaluation:
  max_new_tokens: 24576
  output_dir: outputs/eval
student:
  max_length: 4096
  model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
teacher:
  local_model_path: cache/teacher-model-r1-7b
  max_tokens: 8192
  temperature: 0.6
  top_p: 0.95
  top_logprobs: 20
  gpu_memory_utilization: 0.92
  max_model_len: 10240
  cache_chunk_size: 16
training:
  alpha: 0.7
  batch_size: 1
  curriculum: length
  distill_temperature: 2.0
  eval_steps: 5
  gradient_accumulation_steps: 4
  learning_rate: 1e-5
  max_grad_norm: 1.0
  num_epochs: 4
  output_dir: outputs
  seed: 42
  skew_lambda: 0.2
  skew_lambda_max: 0.5
  adaptive_skew: true
  teacher_confidence_weight: true
  test_eval_steps: 0
  test_eval_problems: 5
  test_eval_max_new_tokens: 1024
  warmup_steps: 10
