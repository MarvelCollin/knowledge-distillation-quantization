x-gpu-env: &gpu-env
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  TOKENIZERS_PARALLELISM: "false"
  PYTHONUNBUFFERED: "1"

x-gpu-deploy: &gpu-deploy
  resources:
    reservations:
      devices:
        - driver: nvidia
          count: 1
          capabilities: [gpu]

services:
  train:
    build: .
    env_file: .env
    environment: *gpu-env
    volumes:
      - .:/workspace
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: python scripts/train.py --config config/config.yaml
    deploy: *gpu-deploy

  evaluate:
    build: .
    env_file: .env
    environment: *gpu-env
    volumes:
      - .:/workspace
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: python scripts/evaluate.py --config config/config.yaml --checkpoint outputs/final
    deploy: *gpu-deploy

  compare_eval:
    build: .
    env_file: .env
    environment: *gpu-env
    volumes:
      - .:/workspace
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: python scripts/compare_eval.py
    deploy: *gpu-deploy

volumes: {}
