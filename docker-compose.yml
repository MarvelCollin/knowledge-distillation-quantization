services:
  train:
    build: .
    env_file: .env
    volumes:
      - .:/workspace
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: python train.py --config config/config.yaml
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  evaluate:
    build: .
    env_file: .env
    volumes:
      - .:/workspace
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: python evaluate.py --config config/config.yaml --checkpoint outputs/final
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  compare_eval:
    build: .
    env_file: .env
    volumes:
      - .:/workspace
      - ~/.cache/huggingface:/root/.cache/huggingface
    command: python compare_eval.py
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes: {}
